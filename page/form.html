<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../src/index.less">
    <title>Document</title>
</head>

<body>
    <div class="container-sm">
        <form style="width:400px;margin: 1em auto;">
            <label for="name">First Name</label>
            <input name="name" type="text" class="w-full" placeholder="Placeholder Test">
            <label for="name">Error</label>
            <input class="error w-full" type="text" placeholder="Placeholder Error">
            <label for="fruit">Fruit</label>
            <select id="fruit" required>
                <option value="" selected>Select a fruit…</option>
                <option>…</option>
            </select>
            <fieldset>
                <legend>Size</legend>
                <input type="radio" id="small" name="size" value="small" checked>
                <label for="small">
                    Small
                </label>
                <input type="radio" id="medium" name="size" value="medium">
                <label for="medium">
                    Medium
                </label>
            </fieldset>
            <fieldset>
                <legend>Choose your monster's features:</legend>

                <div>
                    <input type="checkbox" id="scales" name="scales" checked>
                    <label for="scales">Scales</label>
                </div>

                <div>
                    <input type="checkbox" id="horns" name="horns">
                    <label for="horns">Horns</label>
                </div>
            </fieldset>
            <input type="file">
            <input type="date">
            <input type="time">
            <button type="submit">Submit</button>
            <button class="cyan" type="reset">Reset</button>
        </form>
    </div>
</body>

</html>
